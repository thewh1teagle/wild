name: PE/COFF Vibe acceptance

on:
  workflow_dispatch:

concurrency:
  group: pe-vibe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VIBE_REVISION: 1c5466b21b2228d708d9140d0f2ec71f69c0bb3e

jobs:
  build-wild:
    name: Build Wild linker (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out Wild
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Wild build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: pe-vibe-wild

      - name: Build Wild
        run: >-
          cargo build --profile ci -p wild-linker
          --no-default-features --features pe

      - name: Package Wild as link.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/pe-linker | Out-Null
          Copy-Item target/ci/wild.exe target/pe-linker/link.exe

      - name: Upload Wild linker
        uses: actions/upload-artifact@v4
        with:
          name: wild-pe-linker
          path: target/pe-linker/link.exe
          if-no-files-found: error
          retention-days: 1

  windows-vibe:
    name: Vibe ${{ matrix.profile }} (Windows x86-64)
    needs: build-wild
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            build-flag: --debug
          - profile: release
            build-flag: ''
    steps:
      - name: Check out audited Vibe revision
        uses: actions/checkout@v7
        with:
          repository: thewh1teagle/vibe
          ref: 1c5466b21b2228d708d9140d0f2ec71f69c0bb3e
          path: vibe-source
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vibe-source/desktop/pnpm-lock.yaml

      - name: Restore Vibe Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vibe-source -> target
          shared-key: pe-vibe-${{ matrix.profile }}
          cache-on-failure: true

      - name: Download Wild linker
        uses: actions/download-artifact@v4
        with:
          name: wild-pe-linker
          path: target/pe-linker

      - name: Select Wild as link.exe
        shell: pwsh
        run: |
          $linker = (Resolve-Path target/pe-linker/link.exe).Path
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify pinned Vibe revision
        shell: pwsh
        working-directory: vibe-source
        run: |
          $revision = git rev-parse HEAD
          if ($revision -ne $env:VIBE_REVISION) {
            throw "Expected Vibe $env:VIBE_REVISION, checked out $revision"
          }

      - name: Install Vibe frontend dependencies
        working-directory: vibe-source/desktop
        run: pnpm install --frozen-lockfile

      - name: Restore Vibe sidecars
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: vibe-source/desktop/src-tauri/binaries
          key: vibe-sidecars-windows-x64-${{ env.VIBE_REVISION }}

      - name: Install uv
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.6
          enable-cache: true

      - name: Download Vibe sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: vibe-source
        run: uv run scripts/pre_build.py --target x86_64-pc-windows-msvc

      - name: Verify Vibe sidecars
        shell: pwsh
        working-directory: vibe-source
        run: |
          $binaries = 'desktop/src-tauri/binaries'
          foreach ($name in @(
            'sona-x86_64-pc-windows-msvc.exe',
            'ffmpeg-x86_64-pc-windows-msvc.exe'
          )) {
            if (-not (Test-Path (Join-Path $binaries $name))) {
              throw "pre_build.py did not produce $name"
            }
          }

      - name: Build Vibe ${{ matrix.profile }} with Wild
        working-directory: vibe-source/desktop
        env:
          # Wild's save-dir support records every loaded link input plus a
          # relocatable run-with script. WILD_SAVE_BASE is concurrency-safe,
          # unlike WILD_SAVE_DIR, when Cargo invokes multiple linkers.
          WILD_SAVE_BASE: ${{ runner.temp }}\wild-save-${{ matrix.profile }}
        run: >-
          pnpm exec tauri build ${{ matrix.build-flag }} --no-bundle
          --target x86_64-pc-windows-msvc

      - name: Locate Vibe linker repro
        if: always()
        shell: pwsh
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP "wild-save-$env:VIBE_PROFILE"
          if (-not (Test-Path $base)) {
            Write-Warning "Wild did not create a save base at $base"
            exit 0
          }

          $candidate = Get-ChildItem $base -Directory |
            Where-Object {
              $runWith = Join-Path $_.FullName 'run-with'
              (Test-Path $runWith) -and
                (Select-String -Path $runWith -Pattern 'vibe.exe' -SimpleMatch -Quiet)
            } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) {
            Write-Warning "No saved link invocation targets vibe.exe under $base"
            Get-ChildItem $base -Directory | Select-Object -ExpandProperty FullName
            exit 0
          }

          $files = Get-ChildItem $candidate.FullName -File -Recurse
          $bytes = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Captured Vibe link repro at $($candidate.FullName)"
          Write-Host "Repro contains $($files.Count) files and $bytes bytes"
          Get-Content (Join-Path $candidate.FullName 'run-with') | Select-Object -Last 3
          "VIBE_LINK_REPRO=$($candidate.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure scoped Vibe crash dumps
        shell: pwsh
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP "vibe-dumps-$env:VIBE_PROFILE"
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null

          # WER documents LocalDumps under HKLM. The application-name subkey
          # keeps this runner-wide setting scoped to vibe.exe.
          $key = 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\vibe.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString `
            -Value $dumpDirectory -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord `
            -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord `
            -Value 4 -Force | Out-Null

          "VIBE_DUMP_DIRECTORY=$dumpDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $startFile = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.started.txt"
          "VIBE_RUNTIME_START_FILE=$startFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Vibe ${{ matrix.profile }} executable on Windows
        shell: pwsh
        working-directory: vibe-source
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $directory = Join-Path 'target/x86_64-pc-windows-msvc' $env:VIBE_PROFILE
          $executable = Join-Path $directory 'vibe.exe'
          if (-not (Test-Path $executable)) {
            throw "Missing Vibe $env:VIBE_PROFILE executable: $executable"
          }
          foreach ($sidecar in @('sona.exe', 'ffmpeg.exe')) {
            $sidecarPath = Join-Path $directory $sidecar
            if (-not (Test-Path $sidecarPath)) {
              throw "Missing Vibe $env:VIBE_PROFILE sidecar: $sidecarPath"
            }
          }

          $resolvedExecutable = (Resolve-Path $executable).Path
          $stream = [System.IO.File]::OpenRead($resolvedExecutable)
          $reader = $null
          try {
            if ($stream.Length -lt 64) {
              throw "Vibe $env:VIBE_PROFILE PE is only $($stream.Length) bytes"
            }
            $reader = [System.IO.BinaryReader]::new($stream)
            $dosMagic = $reader.ReadUInt16()
            if ($dosMagic -ne 0x5a4d) {
              throw ('Vibe {0} has DOS magic 0x{1:x4}, expected 0x5a4d' -f `
                $env:VIBE_PROFILE, $dosMagic)
            }

            $stream.Position = 0x3c
            [uint32]$peOffset = $reader.ReadUInt32()
            if ([uint64]$peOffset + 6 -gt [uint64]$stream.Length) {
              throw ('Vibe {0} has out-of-bounds PE offset 0x{1:x8} for {2} bytes' -f `
                $env:VIBE_PROFILE, $peOffset, $stream.Length)
            }

            $stream.Position = $peOffset
            $peSignature = $reader.ReadUInt32()
            $machine = $reader.ReadUInt16()
            if ($peSignature -ne 0x00004550 -or $machine -ne 0x8664) {
              throw ('Vibe {0} has PE signature 0x{1:x8} and machine 0x{2:x4}; expected PE\0\0 and AMD64 (0x8664)' -f `
                $env:VIBE_PROFILE, $peSignature, $machine)
            }
            Write-Host ('Verified Vibe {0}: PE offset 0x{1:x8}, machine 0x{2:x4}, {3} bytes' -f `
              $env:VIBE_PROFILE, $peOffset, $machine, $stream.Length)
          } finally {
            if ($null -ne $reader) {
              $reader.Dispose()
            } else {
              $stream.Dispose()
            }
          }

          $stdout = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.stderr.txt"
          [DateTime]::UtcNow.ToString('o') |
            Set-Content -Path $env:VIBE_RUNTIME_START_FILE -Encoding utf8
          $process = Start-Process -FilePath $resolvedExecutable `
            -ArgumentList '--help' -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          if (-not $process.WaitForExit(30000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Host
            $process.WaitForExit(10000) | Out-Null
            throw "Vibe $env:VIBE_PROFILE did not finish its --help smoke test within 30 seconds"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | Out-Host
            throw "Vibe $env:VIBE_PROFILE exited with code $($process.ExitCode)"
          }

      - name: Capture Vibe ${{ matrix.profile }} failure evidence
        if: failure()
        shell: pwsh
        working-directory: vibe-source
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE-failure-evidence"
          New-Item -ItemType Directory -Force $evidence | Out-Null

          $targetDirectory = Join-Path 'target/x86_64-pc-windows-msvc' $env:VIBE_PROFILE
          foreach ($name in @('vibe.exe', 'sona.exe', 'ffmpeg.exe')) {
            $source = Join-Path $targetDirectory $name
            if (Test-Path $source) {
              Copy-Item $source $evidence
            }
          }

          foreach ($suffix in @('stdout.txt', 'stderr.txt', 'started.txt')) {
            $source = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.$suffix"
            if (Test-Path $source) {
              Copy-Item $source $evidence
            }
          }

          if ($env:VIBE_DUMP_DIRECTORY -and (Test-Path $env:VIBE_DUMP_DIRECTORY)) {
            Copy-Item $env:VIBE_DUMP_DIRECTORY (Join-Path $evidence 'crash-dumps') -Recurse
          }
          if ($env:VIBE_LINK_REPRO -and (Test-Path $env:VIBE_LINK_REPRO)) {
            Copy-Item $env:VIBE_LINK_REPRO (Join-Path $evidence 'link-repro') -Recurse
          }

          $started = (Get-Date).ToUniversalTime().AddMinutes(-10)
          if ($env:VIBE_RUNTIME_START_FILE -and (Test-Path $env:VIBE_RUNTIME_START_FILE)) {
            $recorded = Get-Content $env:VIBE_RUNTIME_START_FILE -Raw
            $parsed = [DateTime]::MinValue
            if ([DateTime]::TryParse($recorded, [ref]$parsed)) {
              $started = $parsed.ToUniversalTime().AddMinutes(-1)
            }
          }

          # WER and Application Error records can arrive just after process
          # termination. Give the event service a moment, then retain only
          # records that identify this executable.
          Start-Sleep -Seconds 2
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = $started
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.ProviderName -in @(
              'Application Error',
              'Application Hang',
              'Windows Error Reporting'
            ) -and $_.Message -match '(?i)(^|[^a-z])vibe(?:\.exe)?([^a-z]|$)'
          }
          $eventLog = Join-Path $evidence 'windows-application-events.txt'
          if ($events) {
            $events |
              Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
              Format-List | Out-File $eventLog -Encoding utf8 -Width 4096
          } else {
            "No Vibe Application event records found since $($started.ToString('o'))." |
              Set-Content $eventLog -Encoding utf8
          }

          $manifest = Join-Path $evidence 'manifest.txt'
          @(
            "profile=$env:VIBE_PROFILE"
            "captured_utc=$([DateTime]::UtcNow.ToString('o'))"
            "link_repro=$env:VIBE_LINK_REPRO"
            "dump_directory=$env:VIBE_DUMP_DIRECTORY"
          ) | Set-Content $manifest -Encoding utf8
          Get-ChildItem $evidence -File -Recurse |
            Where-Object FullName -ne $manifest |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}  {2}" -f $hash.Hash, $_.Length, $_.FullName
            } | Add-Content $manifest -Encoding utf8

      - name: Upload Vibe ${{ matrix.profile }} failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-${{ matrix.profile }}-failure-evidence
          path: ${{ runner.temp }}\vibe-${{ matrix.profile }}-failure-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
