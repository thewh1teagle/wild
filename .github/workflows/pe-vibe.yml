name: PE/COFF Vibe acceptance

on:
  workflow_dispatch:

concurrency:
  group: pe-vibe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VIBE_REVISION: 1c5466b21b2228d708d9140d0f2ec71f69c0bb3e

jobs:
  build-wild:
    name: Build Wild linker (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out Wild
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Wild build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: pe-vibe-wild

      - name: Build Wild
        run: >-
          cargo build --profile ci -p wild-linker
          --no-default-features --features pe

      - name: Package Wild as link.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/pe-linker | Out-Null
          Copy-Item target/ci/wild.exe target/pe-linker/link.exe

      - name: Upload Wild linker
        uses: actions/upload-artifact@v4
        with:
          name: wild-pe-linker
          path: target/pe-linker/link.exe
          if-no-files-found: error
          retention-days: 1

  windows-vibe:
    name: Vibe ${{ matrix.profile }} (Windows x86-64)
    needs: build-wild
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            build-flag: --debug
          - profile: release
            build-flag: ''
    steps:
      - name: Check out audited Vibe revision
        uses: actions/checkout@v7
        with:
          repository: thewh1teagle/vibe
          ref: 1c5466b21b2228d708d9140d0f2ec71f69c0bb3e
          path: vibe-source
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vibe-source/desktop/pnpm-lock.yaml

      - name: Restore Vibe Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vibe-source -> target
          shared-key: pe-vibe-${{ matrix.profile }}
          cache-on-failure: true

      - name: Download Wild linker
        uses: actions/download-artifact@v4
        with:
          name: wild-pe-linker
          path: target/pe-linker

      - name: Select Wild as link.exe
        shell: pwsh
        run: |
          $linker = (Resolve-Path target/pe-linker/link.exe).Path
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify pinned Vibe revision
        shell: pwsh
        working-directory: vibe-source
        run: |
          $revision = git rev-parse HEAD
          if ($revision -ne $env:VIBE_REVISION) {
            throw "Expected Vibe $env:VIBE_REVISION, checked out $revision"
          }

      - name: Install Vibe frontend dependencies
        working-directory: vibe-source/desktop
        run: pnpm install --frozen-lockfile

      - name: Restore Vibe sidecars
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: vibe-source/desktop/src-tauri/binaries
          key: vibe-sidecars-windows-x64-${{ env.VIBE_REVISION }}

      - name: Install uv
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.6
          enable-cache: true

      - name: Download Vibe sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: vibe-source
        run: uv run scripts/pre_build.py --target x86_64-pc-windows-msvc

      - name: Verify Vibe sidecars
        shell: pwsh
        working-directory: vibe-source
        run: |
          $binaries = 'desktop/src-tauri/binaries'
          foreach ($name in @(
            'sona-x86_64-pc-windows-msvc.exe',
            'ffmpeg-x86_64-pc-windows-msvc.exe'
          )) {
            if (-not (Test-Path (Join-Path $binaries $name))) {
              throw "pre_build.py did not produce $name"
            }
          }

      - name: Build Vibe ${{ matrix.profile }} with Wild
        working-directory: vibe-source/desktop
        env:
          # Wild's save-dir support records every loaded link input plus a
          # relocatable run-with script. WILD_SAVE_BASE is concurrency-safe,
          # unlike WILD_SAVE_DIR, when Cargo invokes multiple linkers.
          WILD_SAVE_BASE: ${{ runner.temp }}\wild-save-${{ matrix.profile }}
        run: >-
          pnpm exec tauri build ${{ matrix.build-flag }} --no-bundle
          --target x86_64-pc-windows-msvc

      - name: Locate Vibe linker repro
        if: always()
        shell: pwsh
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP "wild-save-$env:VIBE_PROFILE"
          if (-not (Test-Path $base)) {
            Write-Warning "Wild did not create a save base at $base"
            exit 0
          }

          $candidate = Get-ChildItem $base -Directory |
            Where-Object {
              $runWith = Join-Path $_.FullName 'run-with'
              if (-not (Test-Path $runWith)) {
                return $false
              }
              $argumentFiles = @($runWith) + @(
                Get-ChildItem $_.FullName -File -Filter 'at-*.txt' |
                  Select-Object -ExpandProperty FullName
              )
              # Cargo links a hashed artifact in target/.../deps and then
              # copies it to the stable target/.../vibe.exe path.
              return Select-String -Path $argumentFiles `
                -Pattern '(?i)vibe(?:-[0-9a-f]+)?\.exe' -Quiet
            } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) {
            Write-Warning "No saved link invocation targets vibe.exe under $base"
            Get-ChildItem $base -Directory | Select-Object -ExpandProperty FullName
            exit 0
          }

          $files = Get-ChildItem $candidate.FullName -File -Recurse
          $bytes = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Captured Vibe link repro at $($candidate.FullName)"
          Write-Host "Repro contains $($files.Count) files and $bytes bytes"
          Get-ChildItem $candidate.FullName -File -Filter 'at-*.txt' |
            Select-String -Pattern '(?i)^/out:' |
            ForEach-Object { Write-Host "Saved output: $($_.Line)" }
          Get-Content (Join-Path $candidate.FullName 'run-with') | Select-Object -Last 3
          "VIBE_LINK_REPRO=$($candidate.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Replay Vibe link with lld-link
        shell: pwsh
        working-directory: vibe-source
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          if (-not $env:VIBE_LINK_REPRO -or -not (Test-Path $env:VIBE_LINK_REPRO)) {
            throw "The successful Wild build did not produce a Vibe link replay"
          }

          $runWith = Join-Path $env:VIBE_LINK_REPRO 'run-with'
          $bash = (Get-Command bash.exe -ErrorAction Stop).Source
          $lld = (Get-Command lld-link.exe -ErrorAction Stop).Source
          $lldDirectory = Join-Path $env:RUNNER_TEMP "vibe-lld-$env:VIBE_PROFILE"
          New-Item -ItemType Directory -Force $lldDirectory | Out-Null
          "VIBE_LLD_DIRECTORY=$lldDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lldExecutable = Join-Path $lldDirectory 'vibe.exe'
          $lldPdb = Join-Path $lldDirectory 'vibe.pdb'
          $replayLog = Join-Path $lldDirectory 'lld-link-replay.txt'

          # The replay script accepts the linker before `--` and extra linker
          # arguments after it. Keep MSYS from rewriting lld-link's /out path.
          $env:MSYS2_ARG_CONV_EXCL = '/out:;/pdb:'
          & $bash $runWith $lld '--' "/out:$lldExecutable" "/pdb:$lldPdb" 2>&1 |
            Tee-Object -FilePath $replayLog
          if ($LASTEXITCODE -ne 0) {
            throw "lld-link replay failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $lldExecutable)) {
            throw "lld-link replay did not produce $lldExecutable"
          }

          $wildDirectory = Join-Path 'target/x86_64-pc-windows-msvc' $env:VIBE_PROFILE
          foreach ($sidecar in @('sona.exe', 'ffmpeg.exe')) {
            Copy-Item (Join-Path $wildDirectory $sidecar) $lldDirectory
          }

      - name: Configure scoped Vibe crash dumps
        shell: pwsh
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP "vibe-dumps-$env:VIBE_PROFILE"
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null

          # WER documents LocalDumps under HKLM. The application-name subkey
          # keeps this runner-wide setting scoped to vibe.exe.
          $key = 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\vibe.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString `
            -Value $dumpDirectory -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord `
            -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord `
            -Value 4 -Force | Out-Null

          "VIBE_DUMP_DIRECTORY=$dumpDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $startFile = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.started.txt"
          "VIBE_RUNTIME_START_FILE=$startFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Vibe ${{ matrix.profile }} executable on Windows
        shell: pwsh
        working-directory: vibe-source
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = [System.Collections.Generic.List[string]]::new()
          $diagnostics = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE-diagnostics"
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          "VIBE_DIAGNOSTIC_DIRECTORY=$diagnostics" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [DateTime]::UtcNow.ToString('o') |
            Set-Content -Path $env:VIBE_RUNTIME_START_FILE -Encoding utf8

          function Add-Failure([string]$Message) {
            $script:failures.Add($Message)
            Write-Error $Message -ErrorAction Continue
          }

          function Format-ExitCode([int]$Code) {
            $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$Code), 0)
            return '{0} (0x{1:x8})' -f $Code, $unsigned
          }

          function Invoke-Probe(
            [string]$Label,
            [string]$Executable,
            [string[]]$Arguments,
            [int]$TimeoutMilliseconds
          ) {
            $safeLabel = $Label -replace '[^A-Za-z0-9_.-]', '-'
            $stdout = Join-Path $diagnostics "$safeLabel.stdout.txt"
            $stderr = Join-Path $diagnostics "$safeLabel.stderr.txt"
            $parameters = @{
              FilePath = $Executable
              PassThru = $true
              RedirectStandardOutput = $stdout
              RedirectStandardError = $stderr
              WorkingDirectory = Split-Path $Executable
            }
            if ($Arguments.Count -gt 0) {
              $parameters.ArgumentList = $Arguments
            }
            $process = Start-Process @parameters
            $timedOut = -not $process.WaitForExit($TimeoutMilliseconds)
            if ($timedOut) {
              & taskkill.exe /PID $process.Id /T /F | Out-Host
              $process.WaitForExit(10000) | Out-Null
            } else {
              $process.WaitForExit()
            }
            $process.Refresh()
            $exitCode = if ($timedOut) { $null } else { $process.ExitCode }
            $result = [pscustomobject]@{
              Label = $Label
              TimedOut = $timedOut
              ExitCode = $exitCode
              Stdout = $stdout
              Stderr = $stderr
            }
            $result | Format-List | Out-File `
              (Join-Path $diagnostics "$safeLabel.result.txt") -Encoding utf8
            return $result
          }

          function Test-Pe([string]$Label, [string]$Executable) {
            $stream = [System.IO.File]::OpenRead($Executable)
            $reader = $null
            try {
              if ($stream.Length -lt 64) {
                Add-Failure "$Label PE is only $($stream.Length) bytes"
                return $false
              }
              $reader = [System.IO.BinaryReader]::new($stream)
              $dosMagic = $reader.ReadUInt16()
              if ($dosMagic -ne 0x5a4d) {
                Add-Failure ('{0} has DOS magic 0x{1:x4}, expected 0x5a4d' -f `
                  $Label, $dosMagic)
                return $false
              }
              $stream.Position = 0x3c
              [uint32]$peOffset = $reader.ReadUInt32()
              if ([uint64]$peOffset + 6 -gt [uint64]$stream.Length) {
                Add-Failure ('{0} has out-of-bounds PE offset 0x{1:x8} for {2} bytes' -f `
                  $Label, $peOffset, $stream.Length)
                return $false
              }
              $stream.Position = $peOffset
              $signature = $reader.ReadUInt32()
              $machine = $reader.ReadUInt16()
              if ($signature -ne 0x00004550 -or $machine -ne 0x8664) {
                Add-Failure ('{0} has PE signature 0x{1:x8} and machine 0x{2:x4}' -f `
                  $Label, $signature, $machine)
                return $false
              }
              Write-Host ('Verified {0}: PE offset 0x{1:x8}, machine 0x{2:x4}, {3} bytes' -f `
                $Label, $peOffset, $machine, $stream.Length)
              return $true
            } finally {
              if ($null -ne $reader) {
                $reader.Dispose()
              } else {
                $stream.Dispose()
              }
            }
          }

          function Test-Gui([string]$Label, [string]$Executable) {
            $safeLabel = $Label -replace '[^A-Za-z0-9_.-]', '-'
            $stdout = Join-Path $diagnostics "$safeLabel-gui.stdout.txt"
            $stderr = Join-Path $diagnostics "$safeLabel-gui.stderr.txt"
            $profileRoot = Join-Path $env:RUNNER_TEMP "$safeLabel-gui-profile"
            $appData = Join-Path $profileRoot 'roaming'
            $localAppData = Join-Path $profileRoot 'local'
            New-Item -ItemType Directory -Force -Path @($appData, $localAppData) | Out-Null
            $savedAppData = $env:APPDATA
            $savedLocalAppData = $env:LOCALAPPDATA
            $process = $null
            try {
              $env:APPDATA = $appData
              $env:LOCALAPPDATA = $localAppData
              $process = Start-Process -FilePath $Executable -PassThru `
                -WorkingDirectory (Split-Path $Executable) `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              $windowHandle = [IntPtr]::Zero
              while ([DateTime]::UtcNow -lt $deadline) {
                if ($process.HasExited) {
                  break
                }
                $process.Refresh()
                $windowHandle = $process.MainWindowHandle
                if ($windowHandle -ne [IntPtr]::Zero) {
                  break
                }
                Start-Sleep -Milliseconds 250
              }
              if ($process.HasExited) {
                $process.Refresh()
                Add-Failure "$Label GUI exited early with $(Format-ExitCode $process.ExitCode)"
                return
              }
              if ($windowHandle -eq [IntPtr]::Zero) {
                Add-Failure "$Label GUI stayed alive but did not create a top-level window within 20 seconds"
                return
              }
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                $process.Refresh()
                Add-Failure "$Label GUI exited after creating its window with $(Format-ExitCode $process.ExitCode)"
                return
              }
              "window_handle=0x$($windowHandle.ToInt64().ToString('x'))" |
                Set-Content (Join-Path $diagnostics "$safeLabel-gui.result.txt") -Encoding utf8
              Write-Host "$Label GUI created a window and remained alive"
            } finally {
              if ($null -ne $process -and -not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F | Out-Host
                $process.WaitForExit(10000) | Out-Null
              }
              $env:APPDATA = $savedAppData
              $env:LOCALAPPDATA = $savedLocalAppData
            }
          }

          $wildDirectory = (Resolve-Path `
            (Join-Path 'target/x86_64-pc-windows-msvc' $env:VIBE_PROFILE)).Path
          if (-not $env:VIBE_LLD_DIRECTORY -or -not (Test-Path $env:VIBE_LLD_DIRECTORY)) {
            throw "Missing lld-link replay directory"
          }
          $lldDirectory = (Resolve-Path $env:VIBE_LLD_DIRECTORY).Path
          $variants = @(
            [pscustomobject]@{ Name = 'wild'; Directory = $wildDirectory },
            [pscustomobject]@{ Name = 'lld'; Directory = $lldDirectory }
          )

          # This pinned Vibe revision treats any argv[1] as CLI mode and
          # forwards it to sona. Baseline the sidecars before testing that
          # wrapper, then test the actual GUI separately with no arguments.
          $sona = Invoke-Probe 'sidecar-sona-help' `
            (Join-Path $wildDirectory 'sona.exe') @('--help') 30000
          if ($sona.TimedOut) {
            Add-Failure 'sona.exe --help timed out after 30 seconds'
          } elseif ($sona.ExitCode -ne 0) {
            Add-Failure "sona.exe --help exited with $(Format-ExitCode $sona.ExitCode)"
          }
          $ffmpeg = Invoke-Probe 'sidecar-ffmpeg-version' `
            (Join-Path $wildDirectory 'ffmpeg.exe') @('-version') 30000
          $ffmpegOutput = Get-Content $ffmpeg.Stdout, $ffmpeg.Stderr `
            -Raw -ErrorAction SilentlyContinue
          if ($ffmpeg.TimedOut) {
            Add-Failure 'ffmpeg.exe -version timed out after 30 seconds'
          } elseif ($ffmpeg.ExitCode -ne 0 -or $ffmpegOutput -notmatch '(?i)ffmpeg version') {
            Add-Failure "ffmpeg.exe -version did not return a valid version response"
          }

          $llvmReadObj = (Get-Command llvm-readobj.exe -ErrorAction Stop).Source
          foreach ($variant in $variants) {
            $label = "Vibe $env:VIBE_PROFILE ($($variant.Name))"
            $executable = Join-Path $variant.Directory 'vibe.exe'
            if (-not (Test-Path $executable)) {
              Add-Failure "Missing $label executable: $executable"
              continue
            }
            $peValid = Test-Pe $label $executable
            $report = Join-Path $diagnostics "$($variant.Name)-llvm-readobj.txt"
            & $llvmReadObj --file-headers --sections --coff-imports `
              --coff-basereloc --unwind $executable 2>&1 |
              Out-File $report -Encoding utf8 -Width 4096
            if ($LASTEXITCODE -ne 0) {
              Add-Failure "llvm-readobj rejected $label"
            }
            if (-not $peValid) {
              continue
            }

            $cli = Invoke-Probe "$($variant.Name)-vibe-help" `
              $executable @('--help') 30000
            if ($cli.TimedOut) {
              Add-Failure "$label CLI wrapper timed out after 30 seconds"
            } elseif (-not $sona.TimedOut -and $cli.ExitCode -ne $sona.ExitCode) {
              Add-Failure "$label CLI wrapper exited with $(Format-ExitCode $cli.ExitCode); sona baseline was $(Format-ExitCode $sona.ExitCode)"
            }
            Test-Gui $label $executable
          }

          @(
            "profile=$env:VIBE_PROFILE"
            "sona_timed_out=$($sona.TimedOut)"
            "sona_exit=$($sona.ExitCode)"
            "ffmpeg_timed_out=$($ffmpeg.TimedOut)"
            "ffmpeg_exit=$($ffmpeg.ExitCode)"
            "failures=$($failures.Count)"
            $failures
          ) | Set-Content (Join-Path $diagnostics 'acceptance-summary.txt') -Encoding utf8

          if ($failures.Count -ne 0) {
            throw "Vibe acceptance failed:`n$($failures -join "`n")"
          }

      - name: Capture Vibe ${{ matrix.profile }} failure evidence
        if: failure()
        shell: pwsh
        working-directory: vibe-source
        env:
          VIBE_PROFILE: ${{ matrix.profile }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE-failure-evidence"
          New-Item -ItemType Directory -Force $evidence | Out-Null

          $targetDirectory = Join-Path 'target/x86_64-pc-windows-msvc' $env:VIBE_PROFILE
          foreach ($name in @('vibe.exe', 'sona.exe', 'ffmpeg.exe')) {
            $source = Join-Path $targetDirectory $name
            if (Test-Path $source) {
              Copy-Item $source $evidence
            }
          }

          foreach ($suffix in @('stdout.txt', 'stderr.txt', 'started.txt')) {
            $source = Join-Path $env:RUNNER_TEMP "vibe-$env:VIBE_PROFILE.$suffix"
            if (Test-Path $source) {
              Copy-Item $source $evidence
            }
          }

          if ($env:VIBE_DUMP_DIRECTORY -and (Test-Path $env:VIBE_DUMP_DIRECTORY)) {
            Copy-Item $env:VIBE_DUMP_DIRECTORY (Join-Path $evidence 'crash-dumps') -Recurse
          }
          if ($env:VIBE_DIAGNOSTIC_DIRECTORY -and (Test-Path $env:VIBE_DIAGNOSTIC_DIRECTORY)) {
            Copy-Item $env:VIBE_DIAGNOSTIC_DIRECTORY `
              (Join-Path $evidence 'acceptance-diagnostics') -Recurse
          }
          if ($env:VIBE_LLD_DIRECTORY -and (Test-Path $env:VIBE_LLD_DIRECTORY)) {
            Copy-Item $env:VIBE_LLD_DIRECTORY (Join-Path $evidence 'lld-output') -Recurse
          }
          if ($env:VIBE_LINK_REPRO -and (Test-Path $env:VIBE_LINK_REPRO)) {
            Copy-Item $env:VIBE_LINK_REPRO (Join-Path $evidence 'link-repro') -Recurse
          }

          $started = (Get-Date).ToUniversalTime().AddMinutes(-10)
          if ($env:VIBE_RUNTIME_START_FILE -and (Test-Path $env:VIBE_RUNTIME_START_FILE)) {
            $recorded = Get-Content $env:VIBE_RUNTIME_START_FILE -Raw
            $parsed = [DateTime]::MinValue
            if ([DateTime]::TryParse($recorded, [ref]$parsed)) {
              $started = $parsed.ToUniversalTime().AddMinutes(-1)
            }
          }

          # WER and Application Error records can arrive just after process
          # termination. Give the event service a moment, then retain only
          # records that identify this executable.
          Start-Sleep -Seconds 2
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = $started
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.ProviderName -in @(
              'Application Error',
              'Application Hang',
              'Windows Error Reporting'
            ) -and $_.Message -match '(?i)(^|[^a-z])vibe(?:\.exe)?([^a-z]|$)'
          }
          $eventLog = Join-Path $evidence 'windows-application-events.txt'
          if ($events) {
            $events |
              Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
              Format-List | Out-File $eventLog -Encoding utf8 -Width 4096
          } else {
            "No Vibe Application event records found since $($started.ToString('o'))." |
              Set-Content $eventLog -Encoding utf8
          }

          $manifest = Join-Path $evidence 'manifest.txt'
          @(
            "profile=$env:VIBE_PROFILE"
            "captured_utc=$([DateTime]::UtcNow.ToString('o'))"
            "link_repro=$env:VIBE_LINK_REPRO"
            "dump_directory=$env:VIBE_DUMP_DIRECTORY"
            "diagnostic_directory=$env:VIBE_DIAGNOSTIC_DIRECTORY"
            "lld_directory=$env:VIBE_LLD_DIRECTORY"
          ) | Set-Content $manifest -Encoding utf8
          Get-ChildItem $evidence -File -Recurse |
            Where-Object FullName -ne $manifest |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}  {2}" -f $hash.Hash, $_.Length, $_.FullName
            } | Add-Content $manifest -Encoding utf8

      - name: Upload Vibe ${{ matrix.profile }} failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-${{ matrix.profile }}-failure-evidence
          path: ${{ runner.temp }}\vibe-${{ matrix.profile }}-failure-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
