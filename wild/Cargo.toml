[package]
name = "wild-linker"
description = "A very fast linker"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "wild"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
harness = false

[[test]]
name = "windows_pe_smoke"
path = "tests/windows_pe_smoke.rs"

[[test]]
name = "windows_pe_runtime"
path = "tests/windows_pe_runtime.rs"

[dependencies]
libwild = { path = "../libwild", version = "0.9.0", default-features = false }

# This remains off for default ELF/Mach-O builds. PE enables it through the `pe` feature; other
# builds can opt in explicitly with `--features mimalloc`.
mimalloc = { workspace = true, optional = true }

dhat = { workspace = true, optional = true }

[dev-dependencies]
ar.workspace = true
bitflags.workspace = true
blake3.workspace = true
diff.workspace = true
itertools.workspace = true
foldhash.workspace = true
gimli.workspace = true
hex.workspace = true
linker-diff.path = "../linker-diff"
linker-layout.path = "../linker-layout"
libloading.workspace = true
libtest-mimic = { workspace = true }
object.workspace = true
wasmparser.workspace = true
os_info.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde-keyvalue = { workspace = true }
strum.workspace = true
tempfile.workspace = true
toml.workspace = true
which.workspace = true

[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
wait-timeout.workspace = true

[features]
default = ["fork", "plugins", "zstd"]

fork = ["libwild/fork"]

zstd = ["libwild/zstd"]

plugins = ["libwild/plugins"]

perfetto = ["libwild/perfetto"]

wasm = ["libwild/wasm"]

macho = ["libwild/macho"]

mimalloc = ["dep:mimalloc"]

pe = ["libwild/pe", "mimalloc"]

# external tests
external_tests = ["mold_tests"]
mold_tests = []
